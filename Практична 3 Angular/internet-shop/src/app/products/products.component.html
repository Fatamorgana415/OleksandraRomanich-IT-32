<section class="products">
  <h2 class="products__title">Наші товари</h2>

  <div class="products__list">
    <app-product-card
      *ngFor="let product of products"
      [name]="product.name"
      [price]="product.price"
      [description]="product.description"
      (buyClicked)="onBuy($event)">
    </app-product-card>
  </div>
</section>
